<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f3">
  <title>モルック得点表</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f3f6f3;
      --surface: #fff;
      --text: #172a23;
      --muted: #4f6359;
      --line: #d8e3db;
      --accent: #175b41;
      --accent-hover: #10432f;
      --highlight: #e5f3e8;
      --miss: #923b29;
      font-family: "Inter", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    main { width: min(960px, 100%); margin-inline: auto; padding: 32px 20px 48px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.45rem, 3.7vw, 2rem); letter-spacing: -.04em; }
    h2 { font-size: 1rem; }

    .top {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      column-gap: 16px;
      row-gap: 8px;
      margin-bottom: 20px;
    }

    .panel { padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
    .setup { max-width: 540px; }
    .setup h2 { margin-bottom: 14px; }
    .team-fields { list-style: none; display: grid; gap: 8px; padding: 0; margin: 0 0 16px; }
    .team-field { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
    .team-order { text-align: center; color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
    .team-field input {
      width: 100%;
      min-height: 44px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      background: var(--surface);
      font: inherit;
    }

    button {
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      background: var(--surface);
      font: inherit;
      font-size: .9rem;
      font-weight: 650;
      line-height: 1.2;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { opacity: .46; cursor: default; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid #247554;
      outline-offset: 3px;
    }
    .remove-team { padding: 0; font-size: 1.2rem; color: var(--muted); }
    .primary { border-color: var(--accent); color: #fff; background: var(--accent); }
    .setup-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .setup-actions .primary { flex: 1; }

    .game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, .8fr); align-items: start; gap: 14px; }
    .scoreboard { padding: 8px; }
    .scoreboard table { border-spacing: 0 4px; width: 100%; table-layout: fixed; }
    .scoreboard th, .scoreboard td { padding: 10px; }
    .scoreboard thead th { font-size: .77rem; font-weight: 650; color: var(--muted); white-space: nowrap; }
    .scoreboard thead th:nth-child(2) { width: 4.1rem; text-align: right; }
    .scoreboard thead th:nth-child(3) { width: 6.3rem; }
    .scoreboard th:first-child { text-align: left; }
    .scoreboard tbody th { border-radius: 10px 0 0 10px; overflow-wrap: anywhere; }
    .scoreboard tbody td:last-child { border-radius: 0 10px 10px 0; text-align: center; }
    .scoreboard tbody tr[data-state] { background: var(--highlight); }
    .scoreboard tbody tr[data-state="out"] { background: var(--background); color: var(--muted); }
    .scoreboard .score {
      font-size: 1.65rem;
      text-align: right;
      line-height: 1;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.045em;
    }
    .row-label { display: block; color: var(--accent); font-size: .75rem; margin-top: 3px; }
    .row-label:empty { display: none; }
    .miss-dots { display: inline-flex; gap: 5px; align-items: center; vertical-align: middle; }
    .miss-dot { width: 9px; height: 9px; border: 1px solid #859b8d; border-radius: 50%; }
    .miss-dot.filled { background: var(--miss); border-color: var(--miss); }
    .out { color: var(--miss); font-size: .8rem; font-weight: 700; }

    .turn { min-height: 46px; margin-bottom: 12px; }
    .turn-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: .78rem; font-weight: 650; }
    .turn-name { font-size: clamp(1.18rem, 3vw, 1.5rem); letter-spacing: -.024em; overflow-wrap: anywhere; }
    .keypad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
    .key { min-height: 49px; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
    .miss-key { grid-column: span 4; font-size: .9rem; color: var(--miss); background: #fff8f4; border-color: #ead7cd; }
    .control-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .control-actions button { flex: 1; }
    .log { grid-column: 1 / -1; padding: 0 14px; }
    .log summary {
      display: list-item;
      min-height: 44px;
      padding: 13px 0 11px;
      color: var(--muted);
      cursor: pointer;
      font-size: .9rem;
      font-weight: 650;
    }
    .log ol { list-style: none; padding: 0; margin: 0 0 10px; max-height: 240px; overflow-y: auto; }
    .log li {
      display: grid;
      grid-template-columns: 2rem minmax(0, 1fr) auto;
      gap: 6px;
      padding: 9px 4px;
      border-top: 1px solid var(--line);
      font-size: .875rem;
      font-variant-numeric: tabular-nums;
    }
    .log li span:first-child, .log li span:last-child { color: var(--muted); }
    .log li span:nth-child(2) { overflow-wrap: anywhere; }
    .storage-message { margin-bottom: 12px; color: var(--miss); font-size: .875rem; }
    @media (hover: hover) {
      button:not(:disabled):hover { background: var(--highlight); }
      button.primary:not(:disabled):hover { background: var(--accent-hover); }
      button.miss-key:not(:disabled):hover { background: #faeae2; }
    }
    @media (max-width: 640px) {
      main { padding: 16px 12px 28px; }
      .top { margin-bottom: 12px; }
      .game { grid-template-columns: minmax(0, 1fr); gap: 9px; }
      .controls { grid-row: 1; padding: 13px; }
      .turn { min-height: 0; margin-bottom: 9px; }
      .scoreboard th, .scoreboard td { padding: 8px; }
    }

    .setup { max-width: 620px; }
    .setup-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .setup-heading h2 { margin-bottom: 0; }
    .mode-switch { display: inline-flex; padding: 3px; gap: 3px; border: 1px solid var(--line); border-radius: 11px; }
    .mode-switch button { min-height: 36px; padding: 7px 14px; border: 0; }
    .mode-switch button[aria-pressed="true"] { color: #fff; background: var(--accent); }
    #manual-area > h2 { margin-bottom: 12px; }
    .field-title { display: block; margin-bottom: 8px; font-size: .9rem; font-weight: 650; }
    #players { display: block; width: 100%; min-height: 125px; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: #fff; font: inherit; line-height: 1.65; }
    #players:focus-visible { outline: 3px solid #247554; outline-offset: 3px; }
    .auto-actions { display: flex; align-items: end; gap: 10px; margin-top: 14px; }
    .auto-actions > button { margin-left: auto; }
    .number-field { display: inline-flex; align-items: center; gap: 10px; font-size: .9rem; font-weight: 650; }
    .number-field input { width: 76px; height: 44px; padding: 7px 9px; font: inherit; font-variant-numeric: tabular-nums; text-align: center; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--text); }
    .team-preview { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 9px; margin-top: 15px; }
    .preview-card { border: 1px solid var(--line); border-radius: 11px; padding: 12px; background: var(--background); min-width: 0; }
    .preview-card strong { display: block; margin-bottom: 6px; font-size: .9rem; }
    .preview-card ul { margin: 0; padding-left: 1.25rem; line-height: 1.8; font-size: .9rem; overflow-wrap: anywhere; }
    .rule-settings { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--line); }
    .start-game { width: 100%; margin-top: 18px; }
    .form-error { margin-top: 10px; color: var(--miss); font-size: .875rem; }
    .team-members { display: block; color: var(--muted); font-size: .76rem; font-weight: 400; line-height: 1.5; overflow-wrap: anywhere; }
    .team-members:empty { display: none; }
    .miss-count { font-size: .88rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .miss-count.alert { color: var(--miss); font-weight: 700; }
    @media (max-width: 640px) {
      .setup { padding: 16px; }
      .team-preview { grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); }
      .scoreboard thead th:nth-child(3) { width: 5.8rem; }
    }

    .turn-team { display: block; color: var(--muted); font-size: .98rem; font-weight: 650; overflow-wrap: anywhere; }
    .turn-player { display: block; margin-top: 4px; font-size: clamp(1.25rem, 4vw, 1.8rem); font-weight: 750; overflow-wrap: anywhere; letter-spacing: -.025em; }
    .turn-player:empty { display: none; }
    .game-rule-panel { margin-top: 12px; border-top: 1px solid var(--line); }
    .game-rule-panel summary { padding: 13px 0 3px; cursor: pointer; color: var(--muted); font-size: .88rem; font-weight: 650; }
    .game-rule-panel form { padding: 10px 0 2px; }
    .rule-grid { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
    .rule-grid .number-field { flex-wrap: nowrap; }
    .rule-grid .number-field input { width: 70px; }
    .rule-apply { margin-top: 12px; }
    .controls .control-actions { flex-wrap: wrap; }
    .controls .control-actions #skip-turn { flex-basis: 100%; }
    @media (max-width: 640px) {
      .rule-grid { display: grid; gap: 12px; }
      .rule-grid .number-field { justify-content: space-between; }
      .rule-grid .number-field input { margin-left: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <h1>モルック得点表</h1>
      <button id="edit-teams" type="button" hidden>チーム設定</button>
    </header>
    <p id="storage-message" class="storage-message" role="status" hidden>このブラウザーでは試合を自動保存できません。</p>

    <form id="setup" class="panel setup">
      <div class="setup-heading">
        <h2>チーム設定</h2>
        <div class="mode-switch" role="group" aria-label="チーム作成方法">
          <button id="mode-manual" type="button" aria-pressed="true">手動</button>
          <button id="mode-auto" type="button" aria-pressed="false">自動</button>
        </div>
      </div>

      <div id="manual-area">
        <h2>チーム（投球順）</h2>
        <ol id="team-fields" class="team-fields"></ol>
        <button id="add-team" type="button">チーム追加</button>
      </div>

      <div id="auto-area" hidden>
        <label class="field-title" for="players">選手（1行に1人）</label>
        <textarea id="players" rows="6" spellcheck="false" placeholder="選手1&#10;選手2&#10;選手3&#10;選手4"></textarea>
        <div class="auto-actions">
          <label class="number-field" for="team-count">チーム数
            <input id="team-count" type="number" min="2" step="1" inputmode="numeric" value="2">
          </label>
          <button id="shuffle" type="button">シャッフル</button>
        </div>
        <p id="team-warning" class="form-error" role="status" hidden></p>
        <div id="team-preview" class="team-preview" aria-live="polite"></div>
      </div>

      <div class="rule-settings">
        <div class="rule-grid">
          <label class="number-field" for="target-score">目標得点
            <input id="target-score" type="number" min="1" max="999" step="1" inputmode="numeric" value="50">
          </label>
          <label class="number-field" for="reset-score">超過時の得点
            <input id="reset-score" type="number" min="0" max="998" step="1" inputmode="numeric" value="25">
          </label>
          <label class="number-field" for="miss-limit">連続ミスで失格
            <input id="miss-limit" type="number" min="1" max="999" step="1" inputmode="numeric" value="3">
            <span>回</span>
          </label>
        </div>
      </div>
      <button id="start-game" class="primary start-game" type="submit">試合開始</button>
    </form>

    <section id="game" class="game" aria-label="試合" hidden>
      <div class="panel scoreboard">
        <table aria-label="得点表">
          <thead><tr><th scope="col">チーム</th><th scope="col">得点</th><th scope="col">連続ミス</th></tr></thead>
          <tbody id="scoreboard"></tbody>
        </table>
      </div>
      <section class="panel controls" aria-label="得点入力">
        <h2 class="turn" aria-live="polite" aria-atomic="true">
          <span id="turn-label" class="turn-label"></span>
          <span id="turn-name" class="turn-team"></span>
          <span id="turn-player" class="turn-player"></span>
        </h2>
        <div id="keypad" class="keypad" role="group" aria-label="投球点"></div>
        <div class="control-actions">
          <button id="skip-turn" type="button">この番をスキップ</button>
          <button id="undo" type="button">1操作戻す</button>
          <button id="next-game" class="primary" type="button" hidden>次の試合</button>
        </div>
        <details id="game-rules" class="game-rule-panel">
          <summary>ルール変更</summary>
          <form id="game-rules-form" novalidate>
            <div class="rule-grid">
              <label class="number-field" for="game-target-score">目標得点
                <input id="game-target-score" type="number" min="1" max="999" step="1" inputmode="numeric" required>
              </label>
              <label class="number-field" for="game-reset-score">超過時の得点
                <input id="game-reset-score" type="number" min="0" max="998" step="1" inputmode="numeric" required>
              </label>
              <label class="number-field" for="game-miss-limit">連続ミスで失格
                <input id="game-miss-limit" type="number" min="1" max="999" step="1" inputmode="numeric" required>
                <span>回</span>
              </label>
            </div>
            <p id="game-rule-error" class="form-error" role="status" hidden></p>
            <button class="primary rule-apply" type="submit">変更を適用</button>
          </form>
        </details>
      </section>
      <details id="history" class="panel log" hidden>
        <summary>操作履歴</summary>
        <ol id="history-list"></ol>
      </details>
    </section>
  </main>

  <template id="team-row">
    <li class="team-field">
      <span class="team-order" aria-hidden="true"></span>
      <input type="text" maxlength="40" autocomplete="off">
      <button class="remove-team" type="button">×</button>
    </li>
  </template>
  <template id="score-row">
    <tr>
      <th scope="row"><span class="team-name"></span><span class="team-members"></span><span class="row-label"></span></th>
      <td class="score"></td>
      <td class="misses"></td>
    </tr>
  </template>

  <script>
    "use strict";

    const STORAGE_KEY = "molkey-score-v1";
    const TARGET = 50;
    const RESET_SCORE = 25;
    const MAX_THROW = 12;
    const defaultName = index => "チーム" + (index + 1);
    const byId = id => document.getElementById(id);
    const setup = byId("setup");
    const game = byId("game");
    const teamFields = byId("team-fields");
    const keypad = byId("keypad");
    const undo = byId("undo");
    const skipTurn = byId("skip-turn");
    const editTeams = byId("edit-teams");
    const nextGame = byId("next-game");
    const history = byId("history");
    const playersInput = byId("players");
    const teamCountInput = byId("team-count");
    const missLimitInput = byId("miss-limit");
    const targetInput = byId("target-score");
    const resetInput = byId("reset-score");
    const gameRules = byId("game-rules");
    const gameRulesForm = byId("game-rules-form");
    let state = load();

    function rulesValid(rules) {
      return Number.isSafeInteger(rules.targetScore) &&
        rules.targetScore >= 1 && rules.targetScore <= 999 &&
        Number.isSafeInteger(rules.resetScore) &&
        rules.resetScore >= 0 && rules.resetScore < rules.targetScore &&
        Number.isSafeInteger(rules.missLimit) &&
        rules.missLimit >= 1 && rules.missLimit <= 999;
    }

    function toRules(targetScore, resetScore, missLimit) {
      return { targetScore, resetScore, missLimit };
    }

    function load() {
      const fallback = {
        names: ["チーム1", "チーム2"],
        manualNames: ["チーム1", "チーム2"],
        actions: [],
        started: false,
        mode: "manual",
        rosterText: "",
        teamCount: 2,
        assignments: [],
        missLimit: 3,
        targetScore: TARGET,
        resetScore: RESET_SCORE,
        gameRules: toRules(TARGET, RESET_SCORE, 3)
      };
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved ||
            !Array.isArray(saved.names) || saved.names.length < 2 ||
            !saved.names.every(name => typeof name === "string") ||
            typeof saved.started !== "boolean") return fallback;

        const base = toRules(
          Number.isSafeInteger(saved.targetScore) ? saved.targetScore : TARGET,
          Number.isSafeInteger(saved.resetScore) ? saved.resetScore : RESET_SCORE,
          Number.isSafeInteger(saved.missLimit) ? saved.missLimit : 3
        );
        if (!rulesValid(base)) {
          base.targetScore = TARGET;
          base.resetScore = RESET_SCORE;
          base.missLimit = 3;
        }
        const gameRules = saved.gameRules && rulesValid(saved.gameRules)
          ? saved.gameRules : { ...base };

        // Older saved games contain a simple list of point values.
        let actions;
        if (Array.isArray(saved.actions)) {
          actions = saved.actions;
          if (!actions.every(action => action && (
              (action.type === "throw" && Number.isInteger(action.points) &&
                action.points >= 0 && action.points <= MAX_THROW) ||
              action.type === "skip" ||
              (action.type === "rules" && rulesValid(action.rules))
            ))) return fallback;
        } else if (Array.isArray(saved.throws) &&
          saved.throws.every(points => Number.isInteger(points) &&
            points >= 0 && points <= MAX_THROW)) {
          actions = saved.throws.map(points => ({ type: "throw", points }));
        } else {
          return fallback;
        }

        const manualNames = Array.isArray(saved.manualNames) &&
          saved.manualNames.length >= 2 &&
          saved.manualNames.every(name => typeof name === "string")
          ? saved.manualNames : saved.names.slice();

        return {
          names: saved.names,
          manualNames,
          actions,
          started: saved.started,
          mode: saved.mode === "auto" ? "auto" : "manual",
          rosterText: typeof saved.rosterText === "string" ? saved.rosterText : "",
          teamCount: Number.isSafeInteger(saved.teamCount) && saved.teamCount >= 2
            ? saved.teamCount : 2,
          assignments: Array.isArray(saved.assignments) &&
            saved.assignments.every(group => Array.isArray(group) &&
              group.every(name => typeof name === "string"))
            ? saved.assignments : [],
          ...base,
          gameRules
        };
      } catch {
        return fallback;
      }
    }

    function save() {
      const message = byId("storage-message");
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        message.hidden = true;
      } catch {
        message.hidden = false;
      }
    }

    function roster() {
      return state.rosterText.split(/\r?\n/).map(name => name.trim()).filter(Boolean);
    }

    function validTeamCount() {
      const count = state.teamCount;
      return Number.isSafeInteger(count) && count >= 2 && count <= roster().length;
    }

    function validAssignments() {
      if (!validTeamCount() || state.assignments.length !== state.teamCount) return false;
      const source = roster();
      const expected = new Map();
      for (const name of source) expected.set(name, (expected.get(name) || 0) + 1);
      let assigned = 0;
      for (const group of state.assignments) {
        if (!Array.isArray(group) || group.length === 0) return false;
        if (group.length < Math.floor(source.length / state.teamCount) ||
            group.length > Math.ceil(source.length / state.teamCount)) return false;
        for (const name of group) {
          const count = expected.get(name) || 0;
          if (count === 0) return false;
          expected.set(name, count - 1);
          assigned++;
        }
      }
      return assigned === source.length;
    }

    function shuffleTeams() {
      if (!validTeamCount()) return false;
      const mixed = roster().slice();
      for (let i = mixed.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mixed[i], mixed[j]] = [mixed[j], mixed[i]];
      }
      state.assignments = Array.from({ length: state.teamCount }, () => []);
      mixed.forEach((name, index) => state.assignments[index % state.teamCount].push(name));
      save();
      renderPreview();
      return true;
    }

    function renderPreview() {
      const area = byId("team-preview");
      area.replaceChildren();
      if (!validAssignments()) return;
      const cards = state.assignments.map((members, index) => {
        const card = document.createElement("section");
        card.className = "preview-card";
        const title = document.createElement("strong");
        title.textContent = defaultName(index);
        const list = document.createElement("ul");
        for (const member of members) {
          const li = document.createElement("li");
          li.textContent = member;
          list.append(li);
        }
        card.append(title, list);
        return card;
      });
      area.append(...cards);
    }

    function numberFromInput(input) {
      return input.value.trim() === "" ? NaN : Number(input.value);
    }

    function readRules(target, reset, misses) {
      return toRules(numberFromInput(target), numberFromInput(reset),
        numberFromInput(misses));
    }

    function refreshForm() {
      const auto = state.mode === "auto";
      byId("manual-area").hidden = auto;
      byId("auto-area").hidden = !auto;
      byId("mode-manual").setAttribute("aria-pressed", String(!auto));
      byId("mode-auto").setAttribute("aria-pressed", String(auto));
      byId("shuffle").disabled = !validTeamCount();
      byId("start-game").disabled = !rulesValid(
        readRules(targetInput, resetInput, missLimitInput)) ||
        (auto && !validTeamCount());

      const warning = byId("team-warning");
      const goodTeams = validTeamCount();
      warning.hidden = !auto || !state.rosterText.trim() || goodTeams;
      warning.textContent = warning.hidden ? "" :
        (roster().length < 2 ? "選手を2人以上入力してください" :
        "チーム数は2以上、選手数以下にしてください");
    }

    function renderManual() {
      teamFields.replaceChildren();
      state.manualNames.forEach((name, index) => {
        const row = byId("team-row").content.cloneNode(true);
        row.querySelector(".team-order").textContent = index + 1;
        const input = row.querySelector("input");
        input.value = name;
        input.placeholder = defaultName(index);
        input.setAttribute("aria-label", (index + 1) + "番目のチーム名");
        input.addEventListener("input", () => {
          state.manualNames[index] = input.value;
          save();
        });
        const remove = row.querySelector("button");
        remove.setAttribute("aria-label", (index + 1) + "番目のチームを削除");
        remove.disabled = state.manualNames.length <= 2;
        remove.addEventListener("click", () => {
          state.manualNames.splice(index, 1);
          save();
          renderManual();
          teamFields.children[Math.min(index, state.manualNames.length - 1)]
            .querySelector("input").focus();
        });
        teamFields.append(row);
      });
    }

    function renderSetup() {
      renderManual();
      playersInput.value = state.rosterText;
      teamCountInput.value = state.teamCount;
      missLimitInput.value = state.missLimit;
      targetInput.value = state.targetScore;
      resetInput.value = state.resetScore;
      renderPreview();
      refreshForm();
    }

    function replay() {
      const teams = state.names.map(name => ({
        name, score: 0, misses: 0, out: false, playerTurns: 0
      }));
      let rules = { ...state.gameRules };
      const entries = [];
      let turn = 0;
      let winner = null;
      let ended = false;
      for (const action of state.actions) {
        if (ended) break;

        if (action.type === "rules") {
          rules = { ...action.rules };
          entries.push({ type: "rules", rules: { ...rules } });
          continue;
        }
        const team = teams[turn];
        const members = state.mode === "auto" && state.assignments[turn];
        const player = Array.isArray(members) && members.length ?
          members[team.playerTurns % members.length] : "";
        team.playerTurns++;

        if (action.type === "skip") {
          entries.push({ type: "skip", name: team.name, player, total: team.score });
        } else {
          const points = action.points;
          team.misses = points === 0 ? team.misses + 1 : 0;
          team.score += points;
          if (team.score > rules.targetScore) team.score = rules.resetScore;
          const out = team.misses >= rules.missLimit;
          if (out) {
            team.score = 0;
            team.out = true;
          }
          entries.push({ type: "throw", name: team.name, player,
            points, total: team.score, out });
          if (!out && team.score === rules.targetScore) {
            winner = team;
            ended = true;
            break;
          }
          const remaining = teams.filter(candidate => !candidate.out);
          if (remaining.length <= 1) {
            winner = remaining[0] || null;
            ended = true;
            break;
          }
        }
        do {
          turn = (turn + 1) % teams.length;
        } while (teams[turn].out);
      }
      const active = teams[turn];
      const members = state.mode === "auto" && state.assignments[turn];
      const nextPlayer = Array.isArray(members) && members.length ?
        members[active.playerTurns % members.length] : "";
      return { teams, entries, active, nextPlayer, winner, ended, rules };
    }

    function renderScoreboard(teams, active, winner, rules) {
      const rows = teams.map((team, index) => {
        const row = byId("score-row").content.firstElementChild.cloneNode(true);
        row.querySelector(".team-name").textContent = team.name;
        row.querySelector(".score").textContent = team.score;
        const members = state.mode === "auto" && state.assignments[index];
        row.querySelector(".team-members").textContent = members ? members.join("・") : "";
        const label = row.querySelector(".row-label");
        const misses = row.querySelector(".misses");
        if (team === winner) {
          row.dataset.state = "winner";
          label.textContent = "勝利";
        } else if (!winner && team === active && !team.out) {
          row.dataset.state = "active";
          label.textContent = "投球中";
        }
        if (team.out) {
          row.dataset.state = "out";
          const out = document.createElement("span");
          out.className = "out";
          out.textContent = "失格";
          misses.append(out);
        } else {
          const count = document.createElement("span");
          count.className = "miss-count" + (team.misses ? " alert" : "");
          count.textContent = team.misses + " / " + rules.missLimit;
          count.setAttribute("aria-label",
            "連続ミス " + team.misses + "回、失格判定 " + rules.missLimit + "回");
          misses.append(count);
        }
        return row;
      });
      byId("scoreboard").replaceChildren(...rows);
    }

    function renderHistory(entries) {
      history.hidden = entries.length === 0;
      if (!history.open || history.hidden) return;
      const rows = entries.map((entry, index) => {
        const row = document.createElement("li");
        let values;
        if (entry.type === "rules") {
          const r = entry.rules;
          values = [index + 1, "ルール変更",
            "目標" + r.targetScore + " / 超過" + r.resetScore + " / ミス" + r.missLimit + "回"];
        } else {
          values = [index + 1, entry.name + (entry.player ? " / " + entry.player : ""),
            entry.type === "skip" ? "スキップ" :
            entry.out ? "ミス → 失格" :
            (entry.points === 0 ? "ミス" : "+" + entry.points) + " → " + entry.total + "点"];
        }
        for (const value of values) {
          const cell = document.createElement("span");
          cell.textContent = value;
          row.append(cell);
        }
        return row;
      });
      byId("history-list").replaceChildren(...rows.reverse());
    }

    function fillGameRules(rules) {
      byId("game-target-score").value = rules.targetScore;
      byId("game-reset-score").value = rules.resetScore;
      byId("game-miss-limit").value = rules.missLimit;
      byId("game-rule-error").hidden = true;
    }

    function renderGame() {
      const result = replay();
      const { teams, entries, active, nextPlayer, winner, ended, rules } = result;
      renderScoreboard(teams, active, winner, rules);
      byId("turn-label").textContent = winner ? "勝利" : ended ? "試合終了" : "次の投球者";
      byId("turn-name").textContent = winner ? winner.name :
        ended ? "全チーム失格" : active.name;
      byId("turn-player").textContent = ended ? "" : nextPlayer;
      keypad.hidden = ended;
      skipTurn.hidden = ended;
      nextGame.hidden = !ended;
      undo.disabled = state.actions.length === 0;
      gameRules.hidden = ended;
      if (ended) gameRules.open = false;
      if (!gameRules.open) fillGameRules(rules);
      renderHistory(entries);
      return ended;
    }

    function renderView() {
      setup.hidden = state.started;
      game.hidden = !state.started;
      editTeams.hidden = !state.started;
      if (state.started) renderGame();
      else renderSetup();
    }

    function startGame() {
      const rules = readRules(targetInput, resetInput, missLimitInput);
      // During a finished game, the setup fields are not visible;
      // current saved defaults must be used for the following game.
      const freshRules = state.started
        ? toRules(state.targetScore, state.resetScore, state.missLimit)
        : rules;
      if (!rulesValid(freshRules)) return;
      Object.assign(state, freshRules);
      state.gameRules = { ...freshRules };

      if (state.mode === "auto") {
        if (!validTeamCount()) return;
        if (!validAssignments() && !shuffleTeams()) return;
        state.names = state.assignments.map((_, index) => defaultName(index));
      } else {
        state.manualNames = state.manualNames.map((name, index) =>
          name.trim() || defaultName(index));
        state.names = state.manualNames.slice();
      }
      state.started = true;
      state.actions = [];
      history.open = false;
      gameRules.open = false;
      save();
      renderView();
      keypad.firstElementChild.focus();
    }

    function registerAction(action) {
      if (!state.started || replay().ended) return;
      state.actions.push(action);
      save();
      if (renderGame()) nextGame.focus();
    }

    for (let points = 1; points <= MAX_THROW + 1; points++) {
      const isMiss = points > MAX_THROW;
      const key = document.createElement("button");
      key.type = "button";
      key.className = isMiss ? "key miss-key" : "key";
      key.textContent = isMiss ? "ミス（0点）" : String(points);
      if (!isMiss) key.setAttribute("aria-label", points + "点");
      key.addEventListener("click", () =>
        registerAction({ type: "throw", points: isMiss ? 0 : points }));
      keypad.append(key);
    }

    byId("add-team").addEventListener("click", () => {
      let index = state.manualNames.length;
      while (state.manualNames.includes(defaultName(index))) index++;
      state.manualNames.push(defaultName(index));
      save();
      renderManual();
      teamFields.lastElementChild.querySelector("input").select();
    });

    byId("mode-manual").addEventListener("click", () => {
      state.mode = "manual"; save(); refreshForm();
    });
    byId("mode-auto").addEventListener("click", () => {
      state.mode = "auto"; save(); refreshForm(); playersInput.focus();
    });
    playersInput.addEventListener("input", () => {
      state.rosterText = playersInput.value;
      state.assignments = [];
      save(); renderPreview(); refreshForm();
    });
    teamCountInput.addEventListener("input", () => {
      state.teamCount = teamCountInput.value === "" ? NaN : Number(teamCountInput.value);
      state.assignments = [];
      save(); renderPreview(); refreshForm();
    });
    for (const [input, key] of [
      [missLimitInput, "missLimit"],
      [targetInput, "targetScore"],
      [resetInput, "resetScore"]
    ]) {
      input.addEventListener("input", () => {
        const rules = readRules(targetInput, resetInput, missLimitInput);
        if (rulesValid(rules)) {
          state.missLimit = rules.missLimit;
          state.targetScore = rules.targetScore;
          state.resetScore = rules.resetScore;
          save();
        }
        refreshForm();
      });
    }
    byId("shuffle").addEventListener("click", shuffleTeams);

    setup.addEventListener("submit", event => {
      event.preventDefault();
      if (!byId("start-game").disabled) startGame();
    });

    skipTurn.addEventListener("click", () => registerAction({ type: "skip" }));

    gameRulesForm.addEventListener("submit", event => {
      event.preventDefault();
      if (!state.started || replay().ended) return;
      const rules = readRules(
        byId("game-target-score"), byId("game-reset-score"), byId("game-miss-limit"));
      const error = byId("game-rule-error");
      if (!rulesValid(rules)) {
        error.textContent = "目標得点は1以上、超過時は0以上で目標未満、ミス回数は1以上にしてください";
        error.hidden = false;
        return;
      }
      Object.assign(state, rules);
      state.actions.push({ type: "rules", rules: { ...rules } });
      gameRules.open = false;
      save();
      renderGame();
    });

    gameRules.addEventListener("toggle", () => {
      if (gameRules.open && state.started) fillGameRules(replay().rules);
    });

    undo.addEventListener("click", () => {
      if (!state.started || state.actions.length === 0) return;
      state.actions.pop();
      const { rules } = replay();
      Object.assign(state, rules);
      save();
      renderGame();
      if (undo.disabled) keypad.firstElementChild.focus();
    });
    nextGame.addEventListener("click", startGame);

    editTeams.addEventListener("click", () => {
      if (state.actions.length && !replay().ended &&
          !window.confirm("進行中の試合を終了して、チーム設定を開きますか？")) return;
      state.started = false;
      state.actions = [];
      save();
      renderView();
      (state.mode === "auto" ? playersInput :
        teamFields.firstElementChild.querySelector("input")).focus();
    });

    history.addEventListener("toggle", () => {
      if (history.open) renderHistory(replay().entries);
    });
    window.addEventListener("storage", event => {
      if (event.key === STORAGE_KEY) {
        state = load();
        renderView();
      }
    });
    renderView();
  </script>
</body>
</html>
